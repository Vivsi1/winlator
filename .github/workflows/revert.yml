name: Revert commit (safe auto-resolve)

on:
  workflow_dispatch:

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Revert commit safely
        run: |
          set +e

          git revert a29ce561807e3fc53fac7e09d548c2d2f3e25854

          if [ -f app/src/main/java/com/winlator/cmod/ExternalControllerBindingsActivity.java ]; then
            echo "Removing conflicting file"
            git rm app/src/main/java/com/winlator/cmod/ExternalControllerBindingsActivity.java
          fi

          git add -A

          if [ -d .git/revert-apply ] || [ -d .git/sequencer ]; then
            git revert --continue
          else
            echo "No revert in progress"
          fi

      - name: Push changes
        run: |
          git push origin HEAD
